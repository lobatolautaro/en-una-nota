<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d1f2b">
  <title>En una nota de Loba· Jugador</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Lobby -->
  <section id="lobby" class="screen lobby-screen">
    <h1>En una nota de Loba</h1>

    <div id="join-form" class="card">
      <input id="name" maxlength="20" placeholder="Tu nombre" autocomplete="off">
      <button id="ready-btn" class="btn btn-primary btn-big">Listo</button>
      <p id="join-error" class="error"></p>
    </div>

    <div id="waiting" class="card hidden">
      <p class="waiting-msg">Esperando que el anfitrión inicie la partida...</p>
      <h3>Jugadores conectados</h3>
      <ul id="player-list" class="plain-list"></ul>
    </div>
  </section>

  <!-- Juego -->
  <section id="game" class="screen game-screen hidden">
    <div id="score-badge" class="score-badge">Puntaje: <strong id="my-score">0</strong></div>
    <div id="pad" class="pad state-active">
      <div id="pad-text" class="pad-text">¡TOCÁ!</div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
